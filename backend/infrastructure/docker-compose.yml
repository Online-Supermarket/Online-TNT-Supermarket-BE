# ─────────────────────────────────────────────────────────────────────────────
# TNT Supermarket — Local Development Docker Compose
#
# Usage:
#   Start all:   docker compose -f infrastructure/docker-compose.yml --env-file infrastructure/.env up -d
#   Stop all:    docker compose -f infrastructure/docker-compose.yml down
#   Rebuild:     docker compose -f infrastructure/docker-compose.yml --env-file infrastructure/.env up -d --build
#   Logs:        docker compose -f infrastructure/docker-compose.yml logs -f <service-name>
#
# Port Map:
#   5000  → API Gateway
#   5001  → Identity Service
#   5002  → User Service
#   5003  → Product Service
#   5004  → Order Service
#   5005  → Cart Service
#   5006  → Payment Service
#   5007  → Inventory Service
#   5008  → Notification Service
#   5432  → PostgreSQL (Identity DB)
#   5433  → PostgreSQL (User DB)
#   5434  → PostgreSQL (Product DB)
#   5435  → PostgreSQL (Order DB)
#   5436  → PostgreSQL (Cart DB)
#   5437  → PostgreSQL (Payment DB)
#   5438  → PostgreSQL (Inventory DB)
#   9092  → Kafka (internal)
#   9094  → Kafka (external / host access)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  tnt-network:
    driver: bridge

volumes:
  postgres-identity-data:
  postgres-user-data:
  postgres-product-data:
  postgres-order-data:
  postgres-cart-data:
  postgres-payment-data:
  postgres-inventory-data:
  kafka-data:

services:

  # ─── PostgreSQL — Identity Database ─────────────────────────────────────────
  postgres-identity:
    image: postgres:16-alpine
    container_name: tnt-postgres-identity
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: IdentityDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d IdentityDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL — User Database ──────────────────────────────────────────────
  postgres-user:
    image: postgres:16-alpine
    container_name: tnt-postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: UserDb
    ports:
      - "5433:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d UserDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL — Product Database ──────────────────────────────────────────
  postgres-product:
    image: postgres:16-alpine
    container_name: tnt-postgres-product
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ProductDb
    ports:
      - "5434:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ProductDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL — Order Database ─────────────────────────────────────────────
  postgres-order:
    image: postgres:16-alpine
    container_name: tnt-postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: OrderDb
    ports:
      - "5435:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d OrderDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL — Cart Database ──────────────────────────────────────────────
  postgres-cart:
    image: postgres:16-alpine
    container_name: tnt-postgres-cart
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: CartDb
    ports:
      - "5436:5432"
    volumes:
      - postgres-cart-data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d CartDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL — Payment Database ──────────────────────────────────────────
  postgres-payment:
    image: postgres:16-alpine
    container_name: tnt-postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: PaymentDb
    ports:
      - "5437:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d PaymentDb"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ─── Apache Kafka (KRaft mode — no ZooKeeper) ────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: tnt-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - tnt-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Identity Service — Port 5001 ────────────────────────────────────────────
  identity-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfiles/Dockerfile.Identity
    container_name: tnt-identity-service
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: "${ConnectionStrings__IdentityDb:-Host=postgres-identity;Port=5432;Database=IdentityDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}}"
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__AccessTokenMinutes: 15
      Jwt__RefreshTokenDays: 7
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserRegisteredTopic: user-events
      Kafka__ClientId: identity-service
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres-identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── User Service — Port 5002 ─────────────────────────────────────────────────
  user-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfiles/Dockerfile.User
    container_name: tnt-user-service
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__UserDb: "Host=postgres-user;Port=5432;Database=UserDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── Product Service — Port 5003 ─────────────────────────────────────────────
  product-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfiles/Dockerfile.Product
    container_name: tnt-product-service
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProductDb: "Host=postgres-product;Port=5432;Database=ProductDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ClientId: product-service
    depends_on:
      postgres-product:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── Order Service — Port 5004 ───────────────────────────────────────────────
  order-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfiles/Dockerfile.Order
    container_name: tnt-order-service
    restart: unless-stopped
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderDb: "Host=postgres-order;Port=5432;Database=OrderDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ClientId: order-service
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── Cart Service — Port 5005 ────────────────────────────────────────────────
  cart-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfiles/Dockerfile.Cart
    container_name: tnt-cart-service
    restart: unless-stopped
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CartDb: "Host=postgres-cart;Port=5432;Database=CartDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres-cart:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── Payment Service — Port 5006 ─────────────────────────────────────────────
  payment-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfiles/Dockerfile.Payment
    container_name: tnt-payment-service
    restart: unless-stopped
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentDb: "Host=postgres-payment;Port=5432;Database=PaymentDb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ClientId: payment-service
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tnt-network


  # ─── Notification Service — Port 5008 ───────────────────────────────────────
  notification-service:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfiles/Dockerfile.Notification
    container_name: tnt-notification-service
    restart: unless-stopped
    ports:
      - "5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Issuer: TNT.IdentityService
      Jwt__Audience: TNT.Supermarket
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__UserEventsTopic: user-events
      Kafka__ConsumerGroup: notification-service-group
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tnt-network

  # ─── API Gateway — Port 5000 ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: ../..
      dockerfile: backend/infrastructure/Dockerfiles/Dockerfile.Gateway
    container_name: tnt-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-destination__Address: http://identity-service:8080
      ReverseProxy__Clusters__user-cluster__Destinations__user-destination__Address: http://user-service:8080
      ReverseProxy__Clusters__product-cluster__Destinations__product-destination__Address: http://product-service:8080
      ReverseProxy__Clusters__order-cluster__Destinations__order-destination__Address: http://order-service:8080
      ReverseProxy__Clusters__cart-cluster__Destinations__cart-destination__Address: http://cart-service:8080
      ReverseProxy__Clusters__payment-cluster__Destinations__payment-destination__Address: http://payment-service:8080

      ReverseProxy__Clusters__notification-cluster__Destinations__notification-destination__Address: http://notification-service:8080
    depends_on:
      - identity-service
      - user-service
      - product-service
      - order-service
      - cart-service
      - payment-service

    networks:
      - tnt-network
