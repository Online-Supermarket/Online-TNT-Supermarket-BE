name: Code Quality & Metrics — SonarCloud

on:
  workflow_dispatch:
    inputs:
      min_coverage:
        description: "Minimum Line Coverage % for Quality Gate"
        required: false
        default: "0"
        type: string
  push:
    branches: [main, develop, 'feature/**', 'testing/**']
    paths:
      - "services/**"
      - "tests/**"
      - "Directory.Build.props"
      - "coverlet.runsettings"
      - "sonar-project.properties"
      - ".github/workflows/code-quality.yml"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Static Code Analysis & Style Verification (Roslyn + dotnet format)
  # ─────────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Static Code Analysis & Style Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet dependencies
        run: dotnet restore Marketflow.slnx

      - name: Build with Roslyn .NET Analyzers
        run: |
          dotnet build Marketflow.slnx --no-restore --configuration Release 2>&1 | tee build_analysis.log
          WARN_COUNT=$(grep -cE "warning (CA|IDE|CS)[0-9]+" build_analysis.log || true)
          echo "Roslyn Analyzer diagnostics count: $WARN_COUNT"
          echo "### Static Code Analysis (Roslyn .NET Analyzers)" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Solution Build (Release)** | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Analyzer Diagnostics** | $WARN_COUNT warnings |" >> $GITHUB_STEP_SUMMARY

      - name: Verify Code Formatting (dotnet format)
        continue-on-error: true
        run: |
          dotnet format Marketflow.slnx --verify-no-changes --no-restore --verbosity minimal

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Code Coverage, Complexity & SonarCloud Scan
  # ─────────────────────────────────────────────────────────────────────────────
  coverage-and-sonarcloud:
    name: Coverage, Complexity & SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [static-analysis]
    timeout-minutes: 15
    steps:
      - name: Checkout repository (full history for SonarCloud)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Java 17 (SonarScanner runtime)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install ReportGenerator & SonarScanner tools
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          dotnet tool install -g dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Begin SonarCloud Analysis (when SONAR_TOKEN is configured)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            dotnet sonarscanner begin \
              /k:"Online-Supermarket_Online-TNT-Supermarket-BE" \
              /o:"online-supermarket" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.token="$SONAR_TOKEN" \
              /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
              /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"
          else
            echo "SONAR_TOKEN secret not configured; skipping SonarCloud begin."
          fi

      - name: Restore & Build Solution
        run: |
          dotnet restore Marketflow.slnx
          dotnet build Marketflow.slnx --no-restore --configuration Release

      - name: Run Unit Tests & Collect Coverlet Coverage (Cobertura + OpenCover)
        run: |
          dotnet test Marketflow.slnx \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults
        env:
          ASPNETCORE_ENVIRONMENT: Testing

      - name: End SonarCloud Analysis & Upload Metrics
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
          else
            echo "SONAR_TOKEN secret not configured; skipping SonarCloud upload."
          fi

      - name: Generate Interactive HTML Coverage & Complexity Dashboard
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"QualityReport" \
            -reporttypes:"Html;HtmlSummary;TextSummary;JsonSummary" \
            -title:"TNT Supermarket (Marketflow) — Code Quality & Metrics"

      - name: Publish Metrics Summary
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          LINE_COV="0"
          BRANCH_COV="0"
          COVERED="0"
          VALID="0"
          if [ -f "QualityReport/Summary.json" ]; then
            LINE_COV=$(jq -r '.summary.linecoverage // 0' QualityReport/Summary.json)
            BRANCH_COV=$(jq -r '.summary.branchcoverage // 0' QualityReport/Summary.json)
            COVERED=$(jq -r '.summary.coveredlines // 0' QualityReport/Summary.json)
            VALID=$(jq -r '.summary.coverablelines // 0' QualityReport/Summary.json)
          fi
          if [ -n "$SONAR_TOKEN" ]; then
            SONAR_STATUS="Uploaded to SonarCloud"
          else
            SONAR_STATUS="Skipped (Add SONAR_TOKEN secret to enable cloud upload)"
          fi
          {
            echo "### Code Quality & Metrics Results"
            echo ""
            echo "| Metric / Tool | Value |"
            echo "|---|---|"
            echo "| **Owner** | IT24101852 — V.N.Thilanka |"
            echo "| **Line Coverage** | **${LINE_COV}%** (${COVERED} / ${VALID} lines) |"
            echo "| **Branch Coverage** | **${BRANCH_COV}%** |"
            echo "| **Static Analysis** | Roslyn .NET Analyzers (\`AnalysisLevel=latest\`) |"
            echo "| **Complexity & CRAP** | ReportGenerator Interactive HTML Dashboard |"
            echo "| **SonarCloud Sync** | ${SONAR_STATUS} |"
            echo ""
            echo "Download the **code-quality-html-report** artifact below for the full interactive HTML dashboard."
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Code Quality & Coverage HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-html-report
          path: |
            QualityReport/
            TestResults/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Quality Gate & Metrics Summary
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate-summary:
    name: Quality Gate & Metrics Summary
    runs-on: ubuntu-latest
    needs: [static-analysis, coverage-and-sonarcloud]
    if: always()
    steps:
      - name: Pipeline Completion Summary
        run: |
          echo "### Code Quality & Metrics Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Code Analysis (Roslyn & dotnet format) | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage, Complexity & SonarCloud Scan | ${{ needs.coverage-and-sonarcloud.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Interactive HTML Report Artifact | Uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Owner: **IT24101852 — V.N.Thilanka** | Tools: SonarCloud, Coverlet, ReportGenerator, Roslyn Analyzers" >> $GITHUB_STEP_SUMMARY