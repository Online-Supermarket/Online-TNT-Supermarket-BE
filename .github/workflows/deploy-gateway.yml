name: Deploy Gateway to Azure

on:
  workflow_run:
    workflows: [Release gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.AZURE_DEPLOY_ENABLED != 'false')
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_NAME: tnt-gateway-ovindu
      GATEWAY_IMAGE: ovindu0717/tnt-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        env:
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build \
            --tag "${{ env.GATEWAY_IMAGE }}:${SHA}" \
            --tag "${{ env.GATEWAY_IMAGE }}:latest" \
            gateway

      - name: Log in to Docker Hub
        if: ${{ (secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKER_USERNAME != '') && (secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKER_PASSWORD != '') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        if: ${{ (secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKER_USERNAME != '') && (secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKER_PASSWORD != '') }}
        env:
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          push_with_retry() {
            local img="$1"
            local max_attempts=4
            local delay=15
            for attempt in $(seq 1 $max_attempts); do
              echo "Pushing $img (attempt $attempt of $max_attempts)..."
              if docker push "$img"; then
                echo "Successfully pushed $img"
                return 0
              fi
              echo "Push attempt $attempt failed for $img. Waiting ${delay}s before retrying..."
              sleep $delay
              delay=$((delay * 2))
            done
            echo "::error::Failed to push $img after $max_attempts attempts."
            return 1
          }

          push_with_retry "${{ env.GATEWAY_IMAGE }}:${SHA}"
          push_with_retry "${{ env.GATEWAY_IMAGE }}:latest"

      - name: Docker Hub credentials check
        if: ${{ !( (secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKER_USERNAME != '') && (secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKER_PASSWORD != '') ) }}
        run: |
          echo "::notice::Docker Hub credentials are not configured in repository secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN). The image was built locally for validation, but image push to Docker Hub was skipped."

      - name: Log in to Azure (OIDC)
        if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (via OIDC)
        if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: 'docker.io/${{ env.GATEWAY_IMAGE }}:latest'

      - name: Deploy to Azure Web App (via Publish Profile fallback)
        if: ${{ !(secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '') && secrets.AZURE_GATEWAY_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_GATEWAY_PUBLISH_PROFILE }}
          images: 'docker.io/${{ env.GATEWAY_IMAGE }}:latest'
