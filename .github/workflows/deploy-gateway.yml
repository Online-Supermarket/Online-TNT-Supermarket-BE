name: Deploy Gateway to Azure

on:
  workflow_run:
    workflows: [Release gate]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push image
        env:
          IMAGE: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/marketflow-gateway:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build --tag "$IMAGE" gateway
          docker push "$IMAGE"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: tnt-supermarket-gateway
          publish-profile: ${{ secrets.AZURE_GATEWAY_PUBLISH_PROFILE }}
          images: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/marketflow-gateway:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify gateway health
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 10 "https://tnt-supermarket-gateway.azurewebsites.net/health"
