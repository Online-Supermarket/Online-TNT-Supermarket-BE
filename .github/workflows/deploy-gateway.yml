name: Deploy Gateway to Azure

on:
  workflow_run:
    workflows: [Release gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.AZURE_DEPLOY_ENABLED != 'false')
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_NAME: tnt-gateway-ovindu
      GATEWAY_IMAGE: ovindu0717/tnt-gateway
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Docker Hub credentials
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::error::Docker Hub credentials are not configured in repository secrets (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN). Deployment cannot proceed because Azure Web App would run a stale gateway image."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push gateway image
        run: |
          docker build \
            --tag "${{ env.GATEWAY_IMAGE }}:${{ env.IMAGE_TAG }}" \
            --tag "${{ env.GATEWAY_IMAGE }}:latest" \
            gateway

          push_with_retry() {
            local img="$1"
            local max_attempts=4
            local delay=15
            for attempt in $(seq 1 $max_attempts); do
              echo "Pushing $img (attempt $attempt of $max_attempts)..."
              if docker push "$img"; then
                echo "Successfully pushed $img"
                return 0
              fi
              echo "Push attempt $attempt failed for $img. Waiting ${delay}s before retrying..."
              sleep $delay
              delay=$((delay * 2))
            done
            echo "::error::Failed to push $img after $max_attempts attempts."
            return 1
          }

          push_with_retry "${{ env.GATEWAY_IMAGE }}:${{ env.IMAGE_TAG }}"
          push_with_retry "${{ env.GATEWAY_IMAGE }}:latest"

      - name: Deploy Gateway container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_GATEWAY_PUBLISH_PROFILE }}
          images: 'docker.io/${{ env.GATEWAY_IMAGE }}:${{ env.IMAGE_TAG }}'
