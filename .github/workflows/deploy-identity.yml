name: Deploy Identity API to Azure

on:
  workflow_run:
    workflows: [Release gate]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-identity-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AZURE_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ secrets.AZURE_ACR_NAME }}"
      - name: Build and push image
        env:
          IMAGE: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/marketflow-identity:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build --tag "$IMAGE" services/identity/Identity.Api
          docker push "$IMAGE"
      - name: Deploy container image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_IDENTITY }}
          resource-group-name: rg-tnt-supermarket-staging
          sitecontainers-config: >-
            [{"name":"main","image":"${{ secrets.AZURE_ACR_LOGIN_SERVER }}/marketflow-identity:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}","isMain":true,"targetPort":8080,"authType":"SystemIdentity","inheritAppSettingsAndConnectionStrings":true}]
      - name: Verify readiness
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 10 "https://${{ secrets.AZURE_WEBAPP_IDENTITY }}.azurewebsites.net/health/ready"
