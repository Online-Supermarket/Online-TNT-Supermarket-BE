name: SonarQube Code Quality

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Static Analysis and Code Coverage
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube Analysis
        run: |
          dotnet sonarscanner begin \
            /k:"Online-Supermarket_Online-TNT-Supermarket-BE" \
            /o:"online-supermarket" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" \
            /d:sonar.qualitygate.wait=true

      - name: Restore Dependencies
        run: dotnet restore Marketflow.slnx

      - name: Build Solution
        run: dotnet build Marketflow.slnx --no-restore --configuration Release --no-incremental

      - name: Run Unit Tests and Coverage
        run: |
          dotnet test tests/Marketflow.UnitTests \
            --configuration Release \
            --no-build \
            --logger trx \
            --collect:"XPlat Code Coverage;Format=opencover"

      - name: End SonarQube Analysis
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            **/coverage.opencover.xml
            **/*.trx
