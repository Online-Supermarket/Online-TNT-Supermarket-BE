name: Deploy Catalog API to Azure

on:
  workflow_run:
    workflows: [Release gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-catalog-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.AZURE_DEPLOY_ENABLED != 'false')
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_NAME: tnt-catalog-ovindu
      DOTNET_VERSION: '10.0.x'
      PROJECT_PATH: services/catalog/Catalog.Api
      PUBLISH_DIR: ./publish-catalog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Catalog API
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" \
            --configuration Release \
            --output "${{ env.PUBLISH_DIR }}" \
            --nologo

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_CATALOG_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
