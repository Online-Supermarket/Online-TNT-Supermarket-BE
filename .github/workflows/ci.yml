name: CI — TNT Supermarket

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and test the ASP.NET backend
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet dependencies
        run: dotnet restore Marketflow.slnx

      - name: Build solution (no-restore)
        run: dotnet build Marketflow.slnx --no-restore --configuration Release

      - name: Run backend tests
        run: >
          dotnet test
          Marketflow.slnx
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=backend-test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
        env:
          # Ensure tests never accidentally hit a real database
          ASPNETCORE_ENVIRONMENT: Testing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/**
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Validate the Sprint 1–2 service container images
  # ─────────────────────────────────────────────────────────────────────────────
  docker-images:
    name: Docker — ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            context: ./services/identity/Identity.Api
            dockerfile: ./services/identity/Identity.Api/Dockerfile
          - service: catalog
            context: ./services/catalog/Catalog.Api
            dockerfile: ./services/catalog/Catalog.Api/Dockerfile
          - service: order
            context: ./services/order/Order.Api
            dockerfile: ./services/order/Order.Api/Dockerfile
          - service: gateway
            context: ./gateway
            dockerfile: ./gateway/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          pull: true
          push: false
          tags: marketflow-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
