name: CI — TNT Supermarket

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and test the ASP.NET backend
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet dependencies
        run: dotnet restore Marketflow.slnx

      - name: Build solution (no-restore)
        run: dotnet build Marketflow.slnx --no-restore --configuration Release

      - name: Run backend tests
        run: >
          dotnet test
          Marketflow.slnx
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=backend-test-results.trx"
          --collect:"XPlat Code Coverage"
        env:
          # Ensure tests never accidentally hit a real database
          ASPNETCORE_ENVIRONMENT: Testing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: tests/**/TestResults/*.trx
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build the Identity Service Docker image
  # ─────────────────────────────────────────────────────────────────────────────
  docker-identity:
    name: Docker — Identity Service Image
    runs-on: ubuntu-latest
    needs: [backend]   # Only build Docker image if the backend build+tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Identity Service Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/identity/Identity.Api
          file: ./services/identity/Identity.Api/Dockerfile
          push: false       # Set to true and add docker/login-action when deploying
          tags: tnt-identity-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
