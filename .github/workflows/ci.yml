name: CI — TNT Supermarket

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and test the ASP.NET backend
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet dependencies
        run: dotnet restore TNT.Supermarket.sln

      - name: Build solution (no-restore)
        run: dotnet build TNT.Supermarket.sln --no-restore --configuration Release

      - name: Run backend tests
        run: >
          dotnet test
          TNT.Supermarket.sln
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=backend-test-results.trx"
          --collect:"XPlat Code Coverage"
        env:
          # Ensure tests never accidentally hit a real database
          ASPNETCORE_ENVIRONMENT: Testing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx
          retention-days: 7

  migrations:
    name: PostgreSQL 16 — Migrations From Zero
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      Jwt__SecretKey: ci-only-signing-key-never-used-in-production
      ConnectionStrings__IdentityDb: Host=localhost;Port=5432;Database=tnt_identity;Username=postgres;Password=postgres_ci_password;SSL Mode=Disable
      ConnectionStrings__UserDb: Host=localhost;Port=5432;Database=tnt_user;Username=postgres;Password=postgres_ci_password;SSL Mode=Disable
      ConnectionStrings__ProductDb: Host=localhost;Port=5432;Database=tnt_product;Username=postgres;Password=postgres_ci_password;SSL Mode=Disable
      ConnectionStrings__IdentityDbMigrator: Host=localhost;Port=5432;Database=tnt_identity;Username=postgres;Password=postgres_ci_password;SSL Mode=Disable
      ConnectionStrings__UserDbMigrator: Host=localhost;Port=5432;Database=tnt_user;Username=postgres;Password=postgres_ci_password;SSL Mode=Disable
      ConnectionStrings__ProductDbMigrator: Host=localhost;Port=5432;Database=tnt_product;Username=postgres;Password=postgres_ci_password;SSL Mode=Disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore pinned EF tool and projects
        run: |
          dotnet tool restore
          dotnet restore TNT.Supermarket.sln

      - name: Build migration projects
        run: |
          dotnet build src/Services/Identity/TNT.IdentityService.Api/TNT.IdentityService.Api.csproj --no-restore --configuration Release
          dotnet build src/Services/User/TNT.UserService.Api/TNT.UserService.Api.csproj --no-restore --configuration Release
          dotnet build src/Services/Product/TNT.ProductService.Api/TNT.ProductService.Api.csproj --no-restore --configuration Release

      - name: Create isolated service databases
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres tnt_identity
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres tnt_user
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres tnt_product

      - name: Verify discovery and apply migrations
        run: ./scripts/verify-migrations.sh

      - name: Verify Product schema contains repaired migrations
        run: |
          test "$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -d tnt_product -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('Stores','Categories','Products')")" = "3"
          test "$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -d tnt_product -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='Categories' AND column_name='UpdatedAtUtc'")" = "1"

      - name: Generate reviewed migration artifacts
        run: ./scripts/generate-migrations.sh

      - name: Upload migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ef-migration-scripts
          path: backend/artifacts/migrations/*.sql
          retention-days: 14

  docker-images:
    name: Docker — ${{ matrix.name }} Image
    runs-on: ubuntu-latest
    needs: [backend, migrations]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Identity
            dockerfile: Dockerfile.Identity
            image: tnt-identity-service
          - name: User
            dockerfile: Dockerfile.User
            image: tnt-user-service
          - name: Product
            dockerfile: Dockerfile.Product
            image: tnt-product-service
          - name: Gateway
            dockerfile: Dockerfile.Gateway
            image: tnt-api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/infrastructure/Dockerfiles/${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
