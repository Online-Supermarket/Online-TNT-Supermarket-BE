name: Backend CI

on:
  push:
    branches: [ "main", "CI-CD" ]
  pull_request:
    branches: [ "main", "CI-CD" ]
jobs:
  build-and-test:
    name: Build and Test .NET 8 Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore backend/TNT.Supermarket.sln

      - name: Build backend
        run: dotnet build backend/TNT.Supermarket.sln --no-restore --configuration Release

      - name: Run ALL backend tests
        run: dotnet test backend/TNT.Supermarket.sln --no-build --configuration Release --verbosity normal

  docker-build:
    name: Build Backend Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Identity Service
        run: docker build -t tnt-identity-service:latest -f backend/infrastructure/Dockerfiles/Dockerfile.Identity .

      - name: Build User Service
        run: docker build -t tnt-user-service:latest -f backend/infrastructure/Dockerfiles/Dockerfile.User .

      - name: Build Product Service
        run: docker build -t tnt-product-service:latest -f backend/infrastructure/Dockerfiles/Dockerfile.Product .

      - name: Build Order Service
        run: docker build -t tnt-order-service:latest -f backend/infrastructure/Dockerfiles/Dockerfile.Order .

      - name: Build Cart Service
        run: docker build -t tnt-cart-service:latest -f backend/infrastructure/Dockerfiles/Dockerfile.Cart .

      - name: Build Inventory Service
        run: docker build -t tnt-inventory-service:latest -f backend/infrastructure/Dockerfiles/Dockerfile.Inventory .

      - name: Build Payment Service
        run: docker build -t tnt-payment-service:latest -f backend/infrastructure/Dockerfiles/Dockerfile.Payment .

      - name: Build Notification Service
        run: docker build -t tnt-notification-service:latest -f backend/infrastructure/Dockerfiles/Dockerfile.Notification .

      - name: Build API Gateway
        run: docker build -t tnt-api-gateway:latest -f backend/infrastructure/Dockerfiles/Dockerfile.Gateway .
