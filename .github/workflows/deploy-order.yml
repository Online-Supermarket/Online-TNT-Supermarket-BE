name: Deploy Order API to Azure

on:
  workflow_run:
    workflows: [Release gate]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-order-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push image
        env:
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build \
            --tag "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/marketflow-order:${SHA}" \
            --tag "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/marketflow-order:latest" \
            services/order/Order.Api
          docker push "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/marketflow-order:${SHA}"
          docker push "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/marketflow-order:latest"
