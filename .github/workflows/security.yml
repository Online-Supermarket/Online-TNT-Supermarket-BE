name: Security checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore Marketflow.slnx
      - name: Build solution
        run: dotnet build Marketflow.slnx --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test Marketflow.slnx --no-build --no-restore --configuration Release --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Testing

  secrets:
    needs: build-and-test
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --no-git --exit-code 1

  codeql:
    needs: build-and-test
    name: CodeQL (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build Marketflow.slnx --configuration Release
      - uses: github/codeql-action/analyze@v4

  container-vulnerabilities:
    needs: [secrets, codeql]
    name: Container scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            context: services/identity/Identity.Api
          - service: catalog
            context: services/catalog/Catalog.Api
          - service: order
            context: services/order/Order.Api
          - service: gateway
            context: gateway
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --pull --tag marketflow-${{ matrix.service }}:${{ github.sha }} ${{ matrix.context }}
      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: marketflow-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
