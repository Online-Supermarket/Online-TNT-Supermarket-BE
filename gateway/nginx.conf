limit_req_zone $binary_remote_addr zone=marketflow_api:10m rate=20r/s;
# Resolve Compose service names locally and Azure Web App hostnames in staging.
resolver ${MARKETFLOW_DNS_RESOLVER} ipv6=off valid=10s;

server {
  listen 8080;
  server_name _;
  proxy_ssl_server_name on;
  client_max_body_size 10m;

  add_header Access-Control-Allow-Origin "${MARKETFLOW_CORS_ORIGIN}" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  # Upstreams do not own browser CORS. Hide any accidental upstream CORS
  # headers so every gateway response has exactly one policy.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  if ($request_method = OPTIONS) { return 204; }

  location = /health {
    default_type application/json;
    return 200 '{"status":"healthy","service":"gateway"}';
  }

  location /api/identity/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $identity_upstream ${MARKETFLOW_IDENTITY_URL};
    rewrite ^/api/identity/(.*)$ /$1 break;
    proxy_pass $identity_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location /api/catalog/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $catalog_upstream ${MARKETFLOW_CATALOG_URL};
    rewrite ^/api/catalog/(.*)$ /$1 break;
    proxy_pass $catalog_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location = /api/inventory {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $catalog_upstream ${MARKETFLOW_CATALOG_URL};
    rewrite ^/api/inventory$ /inventory break;
    proxy_pass $catalog_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location /api/inventory/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $catalog_upstream ${MARKETFLOW_CATALOG_URL};
    rewrite ^/api/inventory/(.*)$ /inventory/$1 break;
    proxy_pass $catalog_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location /api/order/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $order_upstream ${MARKETFLOW_ORDER_URL};
    rewrite ^/api/order/(.*)$ /$1 break;
    proxy_pass $order_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  # Backward-compatible plural order prefix for older frontend bundles.
  # It forwards to the same Order Service routes as /api/order/.
  location /api/orders/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $order_upstream ${MARKETFLOW_ORDER_URL};
    rewrite ^/api/orders/(.*)$ /orders/$1 break;
    proxy_pass $order_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location /api/reporting/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $reporting_upstream ${MARKETFLOW_REPORTING_URL};
    rewrite ^/api/reporting/(.*)$ /$1 break;
    proxy_pass $reporting_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }
}
