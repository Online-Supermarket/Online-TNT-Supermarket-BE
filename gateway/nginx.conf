limit_req_zone $binary_remote_addr zone=marketflow_api:10m rate=20r/s;
# Docker's embedded DNS lets the gateway follow a recreated service container.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 8080;
  server_name _;

  add_header Access-Control-Allow-Origin "${MARKETFLOW_CORS_ORIGIN}" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  if ($request_method = OPTIONS) { return 204; }

  location = /health {
    default_type application/json;
    return 200 '{"status":"healthy","service":"gateway"}';
  }

  location /api/identity/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $identity_upstream http://identity-api:8080;
    rewrite ^/api/identity/(.*)$ /$1 break;
    proxy_pass $identity_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location /api/catalog/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $catalog_upstream http://catalog-api:8080;
    rewrite ^/api/catalog/(.*)$ /$1 break;
    proxy_pass $catalog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  location /api/order/ {
    limit_req zone=marketflow_api burst=40 nodelay;
    set $order_upstream http://order-api:8080;
    rewrite ^/api/order/(.*)$ /$1 break;
    proxy_pass $order_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }
}
