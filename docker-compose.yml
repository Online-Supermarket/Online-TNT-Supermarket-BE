services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketflow
      POSTGRES_USER: marketflow
      POSTGRES_PASSWORD: marketflow
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketflow -d marketflow"]
      interval: 5s
      timeout: 5s
      retries: 15
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
  identity-api:
    build: ./services/identity/Identity.Api
    environment:
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=marketflow;Username=marketflow;Password=marketflow;Search Path=identity
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-development-only-change-this-signing-key-32chars}
    depends_on:
      postgres: { condition: service_healthy }
  catalog-api:
    build: ./services/catalog/Catalog.Api
    environment:
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=marketflow;Username=marketflow;Password=marketflow;Search Path=catalog
      Services__IdentityUrl: http://identity-api:8080
      Kafka__BootstrapServers: kafka:9092
      Internal__Key: ${CATALOG_INTERNAL_KEY:-marketflow-internal-demo-key}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      identity-api: { condition: service_started }
  order-api:
    build: ./services/order/Order.Api
    environment:
      ConnectionStrings__Order: Host=postgres;Port=5432;Database=marketflow;Username=marketflow;Password=marketflow;Search Path=ordering
      Services__IdentityUrl: http://identity-api:8080
      Services__CatalogUrl: http://catalog-api:8080
      Kafka__BootstrapServers: kafka:9092
      Internal__CatalogKey: ${CATALOG_INTERNAL_KEY:-marketflow-internal-demo-key}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      identity-api: { condition: service_started }
      catalog-api: { condition: service_started }
  reporting-api:
    build: ./services/reporting/Reporting.Api
    environment:
      ConnectionStrings__Reporting: Host=postgres;Port=5432;Database=marketflow;Username=marketflow;Password=marketflow;Search Path=reporting
      Services__IdentityUrl: http://identity-api:8080
      Kafka__BootstrapServers: kafka:9092
    profiles: ["sprint4"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      identity-api: { condition: service_started }
  gateway:
    build: ./gateway
    environment:
      MARKETFLOW_CORS_ORIGIN: ${MARKETFLOW_CORS_ORIGIN:-http://localhost:5173}
    ports: ["8080:8080"]
    depends_on: [identity-api, catalog-api, order-api]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [gateway]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [identity-api, catalog-api, order-api]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
volumes:
  postgres-data:
